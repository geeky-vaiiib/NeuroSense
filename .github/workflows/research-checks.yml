name: Research prototype checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongomock://ci
      MONGODB_DB_NAME: neurosense_ci
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      GAZE_WARMUP: '0'
      NUMBA_CACHE_DIR: /tmp/neurosense-numba
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '25.9.0'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - run: python -m pytest backend/tests -q
      - run: python scripts/check_research_consistency.py
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/
